<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="
      width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no
    ">

  <title>学校AR</title>

  <link
    rel="stylesheet"
    href="./style.css">

</head>

<body>

  <!-- ================================
       スタート画面
  ================================= -->

  <div id="startScreen">

    <h1 id="siteTitle">
      KAGA AR
    </h1>
    
    <p id="siteDescription">
      カメラを起動して、
      キャラクターと一緒に撮影できます。
    </p>

    <button id="startButton">
      カメラを起動
    </button>

    <p id="status"></p>

  </div>


  <!-- ================================
       ARカメラ画面
  ================================= -->

  <div
    id="arScreen"
    class="hidden">


    <div id="cameraWrapper">


      <!-- 実際の撮影範囲 -->

      <div id="cameraArea">


        <video
          id="camera"
          autoplay
          playsinline>
        </video>


        <!--
          キャラクターは
          app.jsでここへ自動生成
        -->

        <div id="characterLayer"></div>


        <!-- 擬似ズーム -->

        <div id="zoomControl">

          <button
            class="zoomButton active"
            data-zoom="1">
            1x
          </button>

          <button
            class="zoomButton"
            data-zoom="1.5">
            1.5x
          </button>

          <button
            class="zoomButton"
            data-zoom="2">
            2x
          </button>

        </div>


      </div>

    </div>


    <!-- ================================
         カメラ操作
    ================================= -->

    <div id="cameraControls">


      <button
        id="resetButton"
        class="sideButton"
        aria-label="キャラクター位置をリセット">

        <span class="controlIcon">
          ↺
        </span>

        <span class="controlLabel">
          リセット
        </span>

      </button>


      <button
        id="captureButton"
        aria-label="撮影">

        <span id="shutterInner"></span>

      </button>


      <button
        id="switchCameraButton"
        class="sideButton"
        aria-label="カメラ切替">

        <span class="controlIcon">
          ⇄
        </span>

        <span class="controlLabel">
          カメラ
        </span>

      </button>


    </div>

  </div>


  <!-- ================================
       撮影結果
  ================================= -->

  <div
    id="resultScreen"
    class="hidden">


    <div id="resultImageArea">

      <canvas id="captureCanvas"></canvas>

    </div>


    <div id="resultControls">

      <button id="backButton">
        撮り直す
      </button>


      <a
        id="downloadButton"
        download="ar-photo.jpg">

        写真を保存

      </a>

    </div>

  </div>


  <script src="./app.js"></script>

</body>

</html>
