<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>学校AR テスト</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="startScreen">
    <h1>学校AR テスト</h1>

    <p>
      カメラを起動して、キャラクターと一緒に撮影できます。
    </p>

    <button id="startButton">
      カメラを起動
    </button>

    <p id="status"></p>
  </div>


  <div id="arScreen" class="hidden">

    <div id="cameraArea">

      <video
        id="camera"
        autoplay
        playsinline>
      </video>

      <img
        id="character"
        src="./images/sample.png"
        alt="キャラクター"
        draggable="false">

    </div>


    <div id="controls">

      <button id="resetButton">
        位置をリセット
      </button>

      <button id="captureButton">
        📷 撮影
      </button>

    </div>

  </div>


  <div id="resultScreen" class="hidden">

    <h2>撮影結果</h2>

    <canvas id="captureCanvas"></canvas>

    <div class="resultButtons">

      <button id="backButton">
        撮り直す
      </button>

      <a
        id="downloadButton"
        download="ar-photo.png">
        写真を保存
      </a>

    </div>

  </div>


  <script src="app.js"></script>

</body>
</html>
