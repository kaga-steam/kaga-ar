<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>学校AR</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <!-- =========================
       スタート画面
  ========================== -->

  <div id="startScreen">

    <h1>学校AR</h1>

    <p>
      カメラを起動して、キャラクターと一緒に撮影できます。
    </p>

    <button id="startButton">
      カメラを起動
    </button>

    <p id="status"></p>

  </div>


  <!-- =========================
       ARカメラ画面
  ========================== -->

  <div id="arScreen" class="hidden">

    <div id="cameraWrapper">

      <!-- 撮影範囲 -->
      <div id="cameraArea">

        <video
          id="camera"
          autoplay
          playsinline>
        </video>

        <img
          id="character"
          src="./images/sample.png"
          alt="キャラクター"
          draggable="false">

      </div>

    </div>


    <!-- カメラアプリ風コントロール -->
    <div id="cameraControls">

      <!-- 左：リセット -->
      <button
        id="resetButton"
        class="sideButton"
        aria-label="位置をリセット">

        <span class="controlIcon">
          ↺
        </span>

        <span class="controlLabel">
          リセット
        </span>

      </button>


      <!-- 中央：シャッター -->
      <button
        id="captureButton"
        aria-label="撮影">

        <span id="shutterInner"></span>

      </button>


      <!-- 右：カメラ切替 -->
      <button
        id="switchCameraButton"
        class="sideButton"
        aria-label="カメラ切替">

        <span class="controlIcon">
          ⇄
        </span>

        <span class="controlLabel">
          カメラ
        </span>

      </button>

    </div>

  </div>


  <!-- =========================
       撮影結果
  ========================== -->

  <div id="resultScreen" class="hidden">

    <div id="resultImageArea">

      <canvas id="captureCanvas"></canvas>

    </div>

    <div id="resultControls">

      <button id="backButton">
        撮り直す
      </button>

      <a
        id="downloadButton"
        download="ar-photo.png">

        写真を保存

      </a>

    </div>

  </div>


  <script src="./app.js"></script>

</body>

</html>
